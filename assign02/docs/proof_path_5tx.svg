<text x="40" y="551.0" font-size="15" font-weight="bold" fill="#18181b">Verifier recomputes the root using only tx2, the 3 sibling hashes and their sides:</text>
<text x="60" y="579.0" font-size="14" font-family="Menlo, Consolas, monospace" fill="#18181b">h0 = H(0x00 ‖ &quot;Carol pays Dave 3&quot;) = 207b4815646bd134…</text>
<text x="60" y="603.0" font-size="14" font-family="Menlo, Consolas, monospace" fill="#18181b">h1 = H(0x01 ‖ h0 ‖ S1)   [S1 is on the right]   = d6f7a3078348cafe…</text>
<text x="60" y="627.0" font-size="14" font-family="Menlo, Consolas, monospace" fill="#18181b">h2 = H(0x01 ‖ S2 ‖ h1)   [S2 is on the left]   = 3f1c30ebb57463a6…</text>
<text x="60" y="651.0" font-size="14" font-family="Menlo, Consolas, monospace" fill="#18181b">h3 = H(0x01 ‖ h2 ‖ S3)   [S3 is on the right]   = beadbc0a7e8cb81f…</text>
<text x="60" y="675.0" font-size="14" font-family="Menlo, Consolas, monospace" fill="#18181b">h3 == published root beadbc0a7e8cb81f…  ⇒  VALID</text>
