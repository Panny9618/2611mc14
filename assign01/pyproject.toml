[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashlab"
version = "1.0.0"
description = "SHA-256 diagnostics for bytes, files and canonical JSON (Blockchain Assignment 1)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hashlab = "hashlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: creates a 100 MB file (deselect with -m 'not slow')"]
